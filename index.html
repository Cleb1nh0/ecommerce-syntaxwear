<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SyntaxWear - tênis e Sneakes Online</title>
  <meta name="description" content="Encontre os melhores tênis e sneakers online na SyntaxWear. Explore nossa coleção exclusiva de calçados para homens e mulheres, com designs modernos e conforto incomparável. Compre agora e transforme seu estilo com nossos produtos de alta qualidade.">
  <link rel="stylesheet" href="./css/reset.css">

<body>
    <header class="header">
			<!-- Logo e navegação -->
			 <h1 class="logo">
				<a href="" title="SyntaxWear - tênis e Sneakes Online">
					<img src="./images/logo/Logo.svg" alt="SyntaxWear - tênis e Sneakes Online">
				</a>
			 </h1>

			 <nav class="nav-center" aria-label="Categorias Principais">
				<ul>
					<li><a href="#">Maculino</a></li>
					<li><a href="#">Feminino</a></li>
					<li><a href="#">Outlet</a></li>
				</ul>
			 </nav>

			 <nav class="nav-right" aria-label="Acesso rápido">
				<ul>
					<li><a href="#">Nossas lojas</a></li>
					<li><a href="#">Sobre</a></li>
					<li>
						<a href="#" aria-label="Minha conta">
							<img src="./images/icons/user.svg" alt="Minha conta" />

					</li>
					<li>
						<a href="#" aria-label="Ajuda">
							<img src="./images/icons/help.svg" alt="Ajuda" />

					</li>
					<li>

				</ul>
			</nav>

		<main>
			<section class="hero-section">
				<!-- Seção hero -->
				 <div class="hero-overlay">
					 <div class="hero-content">
						<span class="hero-subtitle">Krypton One</span>
						<h2 class="hero-title">Transforme qualquer passo em presença.</h2>
						<div class="hero-buttons">
							<a class="btn btn-outline" href="#">Ver modelos</a>
							<a class="btn btn-filled" href="#">Comprar</a>
						</div>
					 </div>
				 </div>
			</section>
			<section class="categories-section">
				<!-- Seção de categorias de tênis -->
					<div class="category-card casual">
						<a href="#"class="category-link">
							<span class="overlay"></span>
							<span class="category-name btn btn-outline">Casual</span>
						</a>
					</div>

					<div class="category-card esporte">
						<a href="#"class="category-link">
							<span class="overlay"></span>
							<span class="category-name btn btn-outline">Esporte</span>
						</a>

				 <div class="category-card moderno">
						<a href="#"class="category-link">
							<span class="overlay"></span>
							<span class="category-name btn btn-outline">Moderno</span>
						</a>
					</div>

					<div class="category-card futurista">
						<a href="#"class="category-link">
							<span class="overlay"></span>
							<span class="category-name btn btn-outline">Futurista</span>
						</a>
					</div>
			</section>
			<section class="grid-section">
				<!-- Grid com produtos em destaque -->
				 <div class="card highlight">
					<div class="top1-content">
						<h3 class="card-title">Kryton One</h3>
						<p class="card-subtitle">Estilo Urbano com atitude</p>
						<div class="cta-group">
							<a class="btn btn-outline" href="#">Feminino</a>
							<a class="btn btn-outline" href="#">Masculino</a>
						</div>
					</div>

				 <div class="card sneaker-purple"></div>
				 <div class="card model"></div>
				 <div class="card sneaker-color"></div>
				 <div class="card sneaker-white"></div>

		</footer>
